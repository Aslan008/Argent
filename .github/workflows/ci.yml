name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # Errors that are bugs, not style: undefined names, syntax errors,
      # shadowed definitions, broken f-strings (configuration in pyproject.toml).
      - name: Lint (ruff)
        run: python -m ruff check .

      # Browser and real-desktop tests are excluded via addopts in pytest.ini:
      # they need a real CDP browser / an interactive desktop. Coverage is
      # reported, not yet gated: the first honest number has to be measured
      # before a threshold means anything.
      - name: Run unit tests
        run: python -m pytest -q --cov=src --cov=tools --cov-report=term-missing:skip-covered

  # The installed artifact must contain every module the entry point imports.
  # A stale editable install once hid this locally: `argent` failed with
  # ModuleNotFoundError: host_os because the flat layout lists modules by hand.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and the light dependency set
        run: |
          pip install build
          pip install -r requirements-ci.txt

      - name: Build the wheel
        run: python -m build --wheel

      - name: Install the wheel and import from outside the source tree
        shell: pwsh
        run: |
          $whl = Get-ChildItem dist/*.whl | Select-Object -First 1
          pip install $whl.FullName
          Set-Location $env:RUNNER_TEMP
          python -c "import argent.host_os, argent.atomic_io, argent.logger, argent.approval, argent.tools.schemas, src.agent.parser; print('wheel imports ok')"

  # A cheap cross-platform guard: the terminal agent is advertised as POSIX
  # capable, but every other job runs on Windows.
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Import the core modules on Linux
        run: python -c "import argent.logger, argent.approval, argent.config, argent.tools.schemas, src.agent.parser; print('linux imports ok')"

      - name: Run the platform-independent core tests
        run: python -m pytest -q tests/test_approval.py tests/test_logger_lazy.py tests/test_lmtrust_parser.py

  rust-tui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/argent-tui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The crate builds with pyo3's `extension-module` feature, so it does not
      # link libpython: the interpreter has to be found at run time instead.
      # Without PYO3_PYTHON the test binaries fail to start with
      # STATUS_DLL_NOT_FOUND (0xc0000135).
      - name: Point pyo3 at the CI interpreter
        run: |
          echo "PYO3_PYTHON=$env:pythonLocation\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:pythonLocation" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # The visual-parity tests run the REPL's own renderer (Rich, Pygments,
      # prompt_toolkit) next to the TUI and compare the two screens cell by cell,
      # so the project's Python dependencies must be importable.
      - name: Install the project's Python dependencies
        run: pip install -r ../../requirements-ci.txt

      - name: Build
        run: cargo build --all-targets

      - name: Run unit, parity and LMTrust blind-spot tests
        run: cargo test --no-fail-fast
        env:
          # Without the Python side the parity tests would skip silently; in CI
          # that has to be a failure.
          ARGENT_REQUIRE_PARITY: "1"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
