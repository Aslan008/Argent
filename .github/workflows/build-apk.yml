name: Build ArgentMobile Android APK

on:
  push:
    paths:
      - 'argent_mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        working-directory: ./argent_mobile
        run: npm install

      - name: Build Web Production Assets
        working-directory: ./argent_mobile
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./argent_mobile
        run: npx cap sync android

      - name: Set Executable Permission for Gradlew
        working-directory: ./argent_mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./argent_mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArgentMobile-debug
          path: argent_mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
