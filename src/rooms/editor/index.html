<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argent · редактор комнат</title>
<link rel="stylesheet" href="/app.css?t=%%TOKEN%%">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-tool" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7.5 10l3 2.2-3 2.2M13 15h3.5"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="10.5" rx="3.5"/><path d="M12 8V4.5M9.5 13h.01M14.5 13h.01M9.5 16h5"/></symbol>
    <symbol id="i-condition" viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></symbol>
    <symbol id="i-human_pause" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.9-4 3.6-6 7.2-6s6.3 2 7.2 6"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></symbol>
    <symbol id="i-notify" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l1.6 2H4.4z"/><path d="M10 20.5a2 2 0 004 0"/></symbol>
    <symbol id="i-room" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><rect x="8" y="8" width="8" height="8" rx="1.8"/></symbol>
    <symbol id="i-spawn_room" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-mcp" viewBox="0 0 24 24"><path d="M9 3.5v5M15 3.5v5"/><path d="M6.5 8.5h11v3a5.5 5.5 0 01-11 0z"/><path d="M12 17v3.5"/></symbol>
    <symbol id="i-skill" viewBox="0 0 24 24"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/><path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></symbol>
    <symbol id="i-plugin" viewBox="0 0 24 24"><path d="M10 4.5a2 2 0 014 0V7h3.5v3.5H20a2 2 0 010 4h-2.5V18H14v-2.5a2 2 0 00-4 0V18H6.5v-3.5H4a2 2 0 010-4h2.5V7H10z"/></symbol>
    <symbol id="i-leeth" viewBox="0 0 24 24"><path d="M13.5 3L5.5 13.5H11L10 21l8.5-11H13z"/></symbol>
    <symbol id="i-foreach" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0113-5l2 2"/><path d="M19.5 4.5V9H15"/><path d="M19.5 12a7.5 7.5 0 01-13 5l-2-2"/><path d="M4.5 19.5V15H9"/></symbol>
    <symbol id="i-wait" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 1.5M9.5 3.5h5"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 4l3 3-3 3"/><path d="M4 11V9a2 2 0 012-2h14"/><path d="M7 20l-3-3 3-3"/><path d="M20 13v2a2 2 0 01-2 2H4"/></symbol>
    <symbol id="i-break" viewBox="0 0 24 24"><path d="M5 5v9a3 3 0 003 3h8"/><path d="M13 13l4 4-4 4"/><path d="M19 4v6"/></symbol>
    <symbol id="i-continue" viewBox="0 0 24 24"><path d="M4 12h12"/><path d="M12 7l5 5-5 5"/><path d="M20 5v14"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7 6.8a7.5 7.5 0 1010 0"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18.5h6M10 21h4"/><path d="M12 3.5a5.5 5.5 0 00-3.2 10c.8.6 1.2 1.3 1.2 2.2V16h4v-.3c0-.9.4-1.6 1.2-2.2A5.5 5.5 0 0012 3.5z"/></symbol>
    <symbol id="i-forget" viewBox="0 0 24 24"><path d="M4.5 19.5l9-9"/><path d="M11 5.5l7.5 7.5-5 5H8.5L5 14.5a2 2 0 010-2.8z"/><path d="M15 19.5h5"/></symbol>
    <symbol id="i-assert" viewBox="0 0 24 24"><path d="M12 3.5l8.5 15h-17z"/><path d="M12 10v4M12 16.8h.01"/></symbol>
    <symbol id="i-parallel" viewBox="0 0 24 24"><path d="M12 3.5v5.5"/><path d="M12 9l-6 5v6.5"/><path d="M12 9l6 5v6.5"/><path d="M3.5 17l2.5 3.5 2.5-3.5"/><path d="M15.5 17l2.5 3.5 2.5-3.5"/></symbol>
    <symbol id="i-join" viewBox="0 0 24 24"><path d="M6 3.5V10l6 5"/><path d="M18 3.5V10l-6 5"/><path d="M12 15v5.5"/><path d="M8.5 17.5l3.5 3 3.5-3"/></symbol>
    <symbol id="i-http" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 3 2.8 15 0 18"/><path d="M12 3c-2.8 3-2.8 15 0 18"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6.5" cy="5.5" r="2"/><circle cx="6.5" cy="18.5" r="2"/><circle cx="17.5" cy="9" r="2"/><path d="M6.5 7.5v9"/><path d="M17.5 11c0 3.5-5 3-9.5 6.2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></symbol>
    <symbol id="i-exit"viewBox="0 0 24 24"><path d="M6 21V4M6 5h11.5l-2.5 4 2.5 4H6"/></symbol>
    <symbol id="i-start" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5A2.5 2.5 0 0118 7v13H7.5A2.5 2.5 0 015 17.5z"/><path d="M5 17.5a2.5 2.5 0 012.5-2.5H18"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M4.5 12h13"/><path d="M13 7l5 5-5 5"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="8" height="6" rx="1.6"/><rect x="12.5" y="14.5" width="8" height="6" rx="1.6"/><path d="M7.5 9.5v3a2 2 0 002 2h3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5v-2a2 2 0 00-2-2h-7a2 2 0 00-2 2v7a2 2 0 002 2h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 114.6 1.3c-.8 1-2.2 1.4-2.2 3M12 17h.01"/></symbol>
  </defs>
</svg>

<header id="topbar">
  <span class="brand">Комнаты</span>
  <select id="roomSelect" aria-label="Открыть комнату" title="Открыть комнату. Комнаты «комплекта» поставляются с Argent, их можно менять, но сохранится копия"></select>
  <span id="roomState" class="chip" hidden></span>
  <button id="btnNew" class="btn" title="Создать новую комнату">Новая</button>
  <span class="grow"></span>
  <button id="btnUndo" class="btn icon ghost" title="Отменить (Ctrl+Z)" aria-label="Отменить"><svg class="ic"><use href="#i-undo"/></svg></button>
  <button id="btnRedo" class="btn icon ghost" title="Вернуть (Ctrl+Y)" aria-label="Вернуть"><svg class="ic"><use href="#i-redo"/></svg></button>
  <span class="sep"></span>
  <button id="btnRun" class="btn run" title="Запустить комнату здесь, не сохраняя (Ctrl+Enter)"><svg class="ic"><use href="#i-play"/></svg>Запустить</button>
  <button id="btnMode" class="btn ghost" aria-pressed="false" title="Простые формы блоков / все настройки">Режим: простой</button>
  <button id="btnGuide" class="btn" title="Гайд: что где и как (F1)"><svg class="ic"><use href="#i-book"/></svg>Гайд</button>
  <button id="btnSave" class="btn primary" title="Проверить и сохранить (Ctrl+S)">Сохранить</button>
</header>

<main>
  <aside id="palette" aria-label="Блоки">
    <div id="paletteBody"></div>
  </aside>

  <section id="center">
    <div id="tabs" role="tablist">
      <button id="tabGraph" role="tab" aria-selected="true">Схема</button>
      <button id="tabStack" role="tab" aria-selected="false" title="Комната столбиком блоков, как в Scratch: вставляйте, убирайте и переставляйте блоки">Стек</button>
      <button id="tabWords" role="tab" aria-selected="false" title="Комната, пересказанная обычными словами">Словами</button>
      <button id="tabJson" role="tab" aria-selected="false" title="Полный текст комнаты: копировать и править руками">JSON</button>
      <button id="tabRuns" role="tab" aria-selected="false" title="Запуски из этого редактора: что и как прошло">Прогоны</button>
    </div>
    <div id="stage">
      <div id="canvasWrap">
        <svg id="svg" class="canvas" width="2400" height="1600"><defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
        </defs><g id="vp"><g id="edges"></g><g id="nodes"></g><path id="tmpEdge" class="tmp" d="" hidden></path></g><rect id="rubber" class="rubber" hidden></rect></svg>
      </div>
      <div id="canvasTools">
        <button id="btnConnect" class="btn sm" title="Нарисовать стрелку: нажмите на шаг, затем на цель. Esc — отмена"><svg class="ic sm"><use href="#i-link"/></svg>Соединить</button>
        <button id="btnLayout" class="btn sm" title="Разложить шаги по слоям автоматически"><svg class="ic sm"><use href="#i-layout"/></svg>Разложить</button>
        <span class="zoom">
          <button id="btnZoomOut" class="btn sm icon" title="Уменьшить (Ctrl + колесо)" aria-label="Уменьшить">−</button>
          <button id="btnZoomReset" class="btn sm" title="Масштаб 100%">100%</button>
          <button id="btnZoomIn" class="btn sm icon" title="Увеличить (Ctrl + колесо)" aria-label="Увеличить">+</button>
          <button id="btnFit" class="btn sm icon" title="Вместить всю схему" aria-label="Вместить"><svg class="ic sm"><use href="#i-fit"/></svg></button>
        </span>
      </div>
      <div id="connectBanner" hidden></div>
      <div id="emptyHint" hidden></div>
      <div id="paneStack" class="pane stackpane" hidden><div id="stackBody"></div></div>
      <div id="paneWords" class="pane words" hidden><div id="wordsBody"></div></div>
      <div id="paneJson" class="pane jsonpane" hidden><div id="jsonBody"></div></div>
      <div id="paneRuns" class="pane runspane" hidden><div id="runsBody"></div></div>
    </div>
    <section id="runDock" hidden aria-label="Запуск">
      <div class="rh">
        <b>Запуск</b>
        <span id="runStatus" class="chip">не запускалась</span>
        <span class="grow"></span>
        <button id="runGo" class="btn primary sm"><svg class="ic sm"><use href="#i-play"/></svg>Запустить</button>
        <button id="runStop" class="btn sm" disabled><svg class="ic sm"><use href="#i-stop"/></svg>Стоп</button>
        <button id="runClear" class="btn sm ghost" title="Убрать подсветку со схемы">Сбросить подсветку</button>
        <button id="runClose" class="btn icon ghost sm" aria-label="Закрыть панель запуска"><svg class="ic sm"><use href="#i-close"/></svg></button>
      </div>
      <div class="rb">
        <div id="runParams" class="rparams"></div>
        <div id="runLog" class="rlog" aria-live="polite"></div>
      </div>
    </section>
  </section>

  <aside id="inspector" aria-label="Свойства"></aside>
</main>

<div id="status" class="ok"><div class="line">Загрузка…</div></div>

<aside id="guide" hidden aria-label="Гайд">
  <div class="gh">
    <h2>Гайд</h2>
    <input type="text" id="gsearch" placeholder="Поиск по гайду…" autocomplete="off">
    <button id="gclose" class="btn icon ghost" aria-label="Закрыть гайд" title="Закрыть (Esc)"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="gb">
    <nav id="gnav"></nav>
    <div id="gcontent">Загрузка гайда…</div>
  </div>
</aside>

<datalist id="fieldsList"></datalist>
<script src="/ext.js?t=%%TOKEN%%"></script>
<script src="/simple.js?t=%%TOKEN%%"></script>
<script src="/profiles.js?t=%%TOKEN%%"></script>
<script src="/stack.js?t=%%TOKEN%%"></script>
<script src="/run.js?t=%%TOKEN%%"></script>
<script src="/app.js?t=%%TOKEN%%"></script>
</body>
</html>
