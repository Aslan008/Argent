[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: tests that need a real CDP browser or an interactive desktop (run explicitly with -m integration)
    real_getters: opt out of a fixture that stubs config getters, to test the getters themselves
    lmtrust: dynamically generated tests by the LMTrust framework
addopts = -m "not integration"
# A test that blocks (a real desktop window that never appears, a modal nobody
# answers, a provider socket that never returns) used to hang the whole run;
# pytest-timeout turns that into one failure and a stack dump.
timeout = 300
timeout_method = thread
