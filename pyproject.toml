[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argent-coder"
dynamic = ["version"]
description = "Argent — an elite terminal AI coding assistant for local (Ollama/KoboldCPP) and cloud (Z.AI/OpenRouter) models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aslan008" }]
keywords = ["ai", "agent", "cli", "coding-assistant", "rag", "ollama", "llm"]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.8.0",
    "markdownify",
    "ddgs",
    "prompt-toolkit",
    "questionary",
    "rich",
    "ollama",
    "openai>=1.0",
    "jedi",
    "pyyaml",
    "json5",
    "numpy",
    "pydantic>=2.0",
    "sympy",
    # Token counting: without it estimate_tokens silently falls back to a
    # char-count heuristic, so context budgeting becomes a guess.
    "tiktoken",
    # Downscaling images before they go to a vision model. Without it a
    # full-page screenshot is sent at full resolution — context spent linearly
    # on detail no model can attend to. view_image degrades but says so.
    "pillow",
]

[project.optional-dependencies]
# Heavy/optional stacks, imported lazily at runtime.
rag = ["chromadb", "sentence-transformers", "pypdf"]
browser = ["playwright", "playwright-stealth"]
research = ["crawl4ai"]
# Backend for the Tauri/web GUI (the terminal version needs none of these).
server = ["fastapi", "uvicorn", "websockets"]
dev = ["pytest"]

[project.scripts]
argent = "main:main"

[tool.setuptools]
# Flat layout: explicit top-level modules plus the src/ and tools/ packages.
py-modules = [
    "agent", "approval", "browser_detect", "browser_engine", "command_handler",
    "config", "deep_research", "doctor", "file_tracker", "hook_manager",
    "intelligence", "logger", "main", "mcp_client", "memory_manager",
    "project_manager", "prompt_compressor", "prompts", "providers", "rag_engine",
    "session", "skill_manager", "storage", "tool_profiles", "tool_recovery",
    "ui", "usage_tracker", "version",
]

[tool.setuptools.packages.find]
include = ["src*", "tools*"]

[tool.setuptools.package-data]
# Ship the declarative starter rooms with the package.
"src.rooms" = ["starter/*.json"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

# pytest configuration lives in pytest.ini (single source).
