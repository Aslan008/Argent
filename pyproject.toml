[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argent-coder"
dynamic = ["version"]
description = "Argent — an elite terminal AI coding assistant for local (Ollama/KoboldCPP) and cloud (Z.AI/OpenRouter) models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aslan008" }]
keywords = ["ai", "agent", "cli", "coding-assistant", "rag", "ollama", "llm"]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.8.0",
    "markdownify",
    "ddgs",
    "prompt-toolkit",
    "questionary",
    "rich",
    "ollama",
    "openai>=1.0",
    "anthropic>=0.40.0",
    "jedi",
    "pyyaml",
    "json5",
    "numpy",
    "pydantic>=2.0",
    "sympy",
    # API keys in the OS credential store (Windows Credential Manager, macOS
    # Keychain, Secret Service) instead of the readable config file. When no
    # backend exists the key falls back to the file, so this is never a hard
    # requirement at run time.
    "keyring>=24",
    # Token counting: without it estimate_tokens silently falls back to a
    # char-count heuristic, so context budgeting becomes a guess.
    "tiktoken",
    # Downscaling images before they go to a vision model. Without it a
    # full-page screenshot is sent at full resolution — context spent linearly
    # on detail no model can attend to. view_image degrades but says so.
    "pillow",
    # Killing a process TREE (a launcher and the server behind it), and telling
    # a live lock holder from a dead one. Without it Argent falls back to
    # taskkill / a process group, and a stdio MCP server started through `uv` or
    # `npx` can outlive Argent holding its pipes.
    "psutil",
    # A terminal of its own for a program that asks questions (npm init, ssh, python -i): ConPTY on Windows
    # (src/agent/pty_process.py). Without it background commands run on pipes and say so.
    "pywinpty; sys_platform == 'win32'",
    # Windows UI Automation: the controls of another program as text (desktop_find / desktop_act).
    # Without it the desktop tools only see window titles.
    "uiautomation; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Heavy/optional stacks, imported lazily at runtime.
rag = ["chromadb", "sentence-transformers", "pypdf"]
browser = ["playwright", "playwright-stealth", "stagehand>=4.1.0"]
research = ["crawl4ai"]
lsp = ["multilspy"]
# Leeth (the local router and the Leeth2 model). torch is often already present;
# transformers and scipy are not, and without them the router cannot load at all —
# the model tests then skip with a reason instead of failing as if the code broke.
#   pip install -e ".[leeth]"
leeth = ["torch", "transformers", "scipy", "onnx", "onnxruntime", "safetensors"]
# pytest-asyncio is not optional: without it every `async def test_...` fails with
# "async def functions are not natively supported" — 49 of them, which hid 129
# working tests behind phantom failures. hypothesis likewise: three files cannot
# even be collected without it.
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "pytest-cov", "hypothesis", "ruff"]

[project.scripts]
argent = "argent.main:main"

# One package. Everything the agent imports lives under `argent/` (its own
# modules, `argent/tools/`); `src/` stays a separate top-level package because
# its data files are addressed by path at run time (`src/leeth/data/...`).
[tool.setuptools.packages.find]
include = ["argent*", "src*"]

[tool.setuptools.package-data]
# Ship the declarative starter rooms with the package.
"src.rooms" = ["starter/*.json", "editor/*.html", "editor/*.json", "editor/*.js", "editor/*.css"]

[tool.setuptools.dynamic]
version = { attr = "argent.version.__version__" }

# pytest configuration lives in pytest.ini (single source).

[tool.ruff]
target-version = "py311"
line-length = 120
# Vendored environments, generated data and runtime state are not source.
extend-exclude = [
    ".argent", ".claude", ".hypothesis", ".pytest_cache", ".ruff_cache", ".uv-cache",
    ".venv", "venv_pyqt6", "node_modules", "argent_mobile", "argento_mobile",
    "scratch", "exports", "leeth3_data", "leeth_live_cases", "reports", "_quarantine",
    "dsh_tmp_test", "crates/argent-tui/target",
]

[tool.ruff.lint]
# Gate on errors that are bugs, not on style: undefined names, syntax errors,
# shadowed definitions and broken f-strings. The full F set (unused imports,
# unused variables) is deliberately not enabled yet — it would be a 900-item
# cleanup, and an `--fix` sweep across this tree is not a safe change.
select = ["E9", "F63", "F7", "F82"]

